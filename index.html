    <link rel="help" href="/llms.txt" type="text/plain" />

    <!-- WebSite Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "GrindLeet",
      "url": "https://grindside.app/",
      "description": "Master coding interviews with NeetCode 150 and Striver's SDE Sheet. 400+ problems with detailed C++ solutions.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://grindside.app/problems?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Educational Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "GrindLeet",
      "url": "https://grindside.app/",
      "description": "Free coding interview preparation platform with NeetCode 150 and Striver's SDE Sheet",
      "sameAs": []
    }
    </script>

    <!-- ItemList for Problem Sets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ItemList",
      "name": "Coding Interview Problem Sets",
      "description": "Curated problem sets for coding interview preparation",
      "numberOfItems": 3,
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "NeetCode 150",
          "url": "https://grindside.app/problems",
          "description": "150 handpicked LeetCode problems across 18 topic patterns with C++ solutions"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Striver's SDE Sheet",
          "url": "https://grindside.app/striver",
          "description": "180+ problems organized by topic for comprehensive SDE interview preparation"
        },
        {
          "@type": "ListItem",
          "position": 3,
          "name": "Algorithm Templates",
          "url": "https://grindside.app/templates",
          "description": "Battle-tested C++ algorithm templates for Binary Search, Two Pointers, Sliding Window, BFS/DFS, and more"
        }
      ]
    }
    </script>

    <!-- FAQ Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is GrindLeet?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "GrindLeet is a free coding interview preparation platform that provides NeetCode 150 and Striver's SDE Sheet with detailed C++ solutions, organized by pattern and difficulty."
          }
        },
        {
          "@type": "Question",
          "name": "How many problems does GrindLeet have?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "GrindLeet contains over 400 problems: 150 from the NeetCode 150 set and 180+ from Striver's SDE Sheet, covering 18 topic patterns."
          }
        },
        {
          "@type": "Question",
          "name": "What topics are covered on GrindLeet?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "GrindLeet covers Arrays & Hashing, Two Pointers, Sliding Window, Stack, Binary Search, Linked List, Trees, Tries, Heap/Priority Queue, Backtracking, Graphs, Advanced Graphs, Dynamic Programming, Greedy, Intervals, Math & Geometry, and Bit Manipulation."
          }
        },
        {
          "@type": "Question",
          "name": "Is GrindLeet free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, GrindLeet is completely free. You can browse all problems and solutions without an account. Sign in to track your progress."
          }
        }
      ]
    }
    </script>
